<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="description" content="LAW.AI — Trợ lý pháp luật Việt Nam" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>LAW.AI — Trợ lý pháp luật Việt Nam</title>
    <script>
      (function () {
        var mode = 'system'
        try { mode = localStorage.getItem('legalai.theme') || 'system' } catch (e) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = mode === 'dark' || (mode !== 'light' && prefersDark)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        root.style.backgroundColor = dark ? '#0f141b' : '#f3f5f8'
        var theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute('content', dark ? '#0f141b' : '#f3f5f8')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>LAW.AI cần JavaScript để hoạt động.</noscript>
  </body>
</html>
